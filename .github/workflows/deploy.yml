name: CI/CD Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🚀 Connecting to server and starting deployment..."
            
            # Navigate to the project directory on the server
            # NOTE: Please adjust this path below to match your actual directory path on your server!
            cd ~/domains/mdcoachinghub.in/public_html
            
            # Fetch latest changes and reset to origin
            echo "📥 Fetching latest code..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            
            # Install dependencies
            echo "📦 Installing npm dependencies..."
            npm install --production=false
            

            # Restart PM2 process
            echo "🔄 Restarting application process manager..."
            pm2 restart all || pm2 start npm --name "md-coaching" -- run start
            
            echo "🎉 Deployment successfully completed!"
