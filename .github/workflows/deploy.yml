name: CI/CD Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🚀 Connecting to server and starting deployment..."

            # Navigate to the project directory on the server
            cd ~/domains/mdcoachinghub.in/public_html

            # Fetch latest changes and reset to master
            echo "📥 Fetching latest code from master..."
            git fetch --all
            git reset --hard origin/master

            # Install ALL dependencies (including devDependencies for build)
            echo "📦 Installing npm dependencies..."
            npm install

            # Build the Next.js app
            echo "🔨 Building Next.js production bundle..."
            npm run build

            # Stop existing PM2 process if running
            echo "🔄 Restarting application via PM2..."
            pm2 delete md-coaching 2>/dev/null || true
            NODE_ENV=production pm2 start server.js --name "md-coaching"
            pm2 save

            echo "🎉 Deployment successfully completed!"
