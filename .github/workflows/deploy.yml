name: CI/CD Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🚀 Starting static deployment..."

            # Go to a temp build directory (NOT public_html)
            mkdir -p ~/build-tmp/md-coaching
            cd ~/build-tmp/md-coaching

            echo "📥 Pulling latest code..."
            git init 2>/dev/null || true
            git remote add origin https://github.com/pashaarshad/website-md-coaching-hub.git 2>/dev/null || git remote set-url origin https://github.com/pashaarshad/website-md-coaching-hub.git
            git fetch --all
            git reset --hard origin/master

            echo "📦 Installing dependencies..."
            npm install

            echo "🔨 Building static export..."
            npm run build

            echo "🗂️ Deploying static files to public_html..."
            # Clear existing files (keep .htaccess if exists)
            find ~/domains/mdcoachinghub.in/public_html -mindepth 1 -not -name '.htaccess' -delete 2>/dev/null || true

            # Copy the static export output
            cp -r ~/build-tmp/md-coaching/out/. ~/domains/mdcoachinghub.in/public_html/

            # Copy images from public/images
            mkdir -p ~/domains/mdcoachinghub.in/public_html/images
            cp -r ~/build-tmp/md-coaching/public/. ~/domains/mdcoachinghub.in/public_html/ 2>/dev/null || true

            echo "🧹 Cleaning up build temp..."
            rm -rf ~/build-tmp/md-coaching

            echo "✅ Deployment complete! Site is live."
