name: CI/CD Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🚀 Starting deployment..."

            cd ~/domains/mdcoachinghub.in/public_html

            echo "📥 Pulling latest code from master..."
            git fetch --all
            git reset --hard origin/master

            echo "📦 Installing dependencies..."
            npm install

            echo "🔨 Building Next.js..."
            npm run build

            echo "🔄 Restarting app (Passenger + PM2 fallback)..."
            # Try Passenger restart first (Hostinger shared hosting)
            mkdir -p tmp
            touch tmp/restart.txt

            # Also try PM2 if available
            pm2 restart md-coaching 2>/dev/null || true
            pm2 describe md-coaching 2>/dev/null || NODE_ENV=production pm2 start server.js --name "md-coaching" 2>/dev/null || true
            pm2 save 2>/dev/null || true

            echo "✅ Deployment done!"
